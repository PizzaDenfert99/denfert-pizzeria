# Pizza Denfert — Nginx reverse-proxy config for the self-hosted VPS.
#
# Serves FOUR public hostnames from the same box:
#   - pizzadenfert.fr           → customer web app (static Expo bundle)
#   - www.pizzadenfert.fr       → 301 to pizzadenfert.fr
#   - api.pizzadenfert.fr       → FastAPI backend  (all /api/* traffic)
#   - loyalty.pizzadenfert.fr   → FastAPI backend  (legacy mirror for the
#                                                    existing tablet-qr-scanner
#                                                    and the admin panel)
#
# TLS: on first boot the nginx container auto-generates self-signed
# placeholder certs so it can start before Let's Encrypt has issued anything.
# Real certs are obtained afterwards via `make cert-issue` (webroot, zero
# downtime).
#
# ACME HTTP-01: /.well-known/acme-challenge/ is served from /var/www/certbot,
# a volume shared with certbot so renewals happen with ZERO downtime.

worker_processes auto;
events { worker_connections 1024; }

http {
  # Upload cap — must stay above the largest app-level limit in
  # server.py's admin_cms_upload_image (currently 50 MB, for kiosk promo
  # videos) plus multipart overhead, or large uploads get rejected with a
  # 413 before FastAPI ever sees them.
  client_max_body_size 60M;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # gzip for the static bundle (JS/CSS/HTML).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  # ---- Port 80: ACME challenges + redirect everything else to HTTPS -------
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pizzadenfert.fr www.pizzadenfert.fr
                api.pizzadenfert.fr loyalty.pizzadenfert.fr _;

    # Let certbot's HTTP-01 challenge succeed without downtime.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- pizzadenfert.fr : customer Expo web bundle -------------------------
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pizzadenfert.fr;

    ssl_certificate     /etc/nginx/certs/pizzadenfert.fr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/pizzadenfert.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/pizzadenfert;
    index index.html;

    # Long-cache Expo-hashed asset files (they contain a content hash).
    location /_expo/  { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|svg|webp|ico)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # Expo Router HTML fallback — send any deep-link URL to index.html so the
    # client router can pick it up (SPA behaviour).
    # The HTML shell itself must always be revalidated (no-cache) so a fresh
    # deploy is picked up immediately — only the hashed /_expo/ and /assets/
    # files above are safe to cache long-term.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }

    # If a client bundle references /api/*, proxy it to the backend so a
    # first-party fetch on the same origin also works (avoids a preflight).
    location /api/ {
      proxy_pass http://backend:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
    }

    # Ad-hoc distributable files dropped directly on the host (e.g. APK
    # builds) for a simple, no-login download link. Publicly readable by
    # anyone with the exact URL — nothing links to this directory and
    # filenames aren't guessable, but there's no auth here by design (the
    # whole point is "no expo.dev login needed"). Directory listing is off
    # by default in nginx, so an unknown filename just 404s.
    location /downloads/ {
      alias /usr/share/nginx/downloads/;
      types {
        application/vnd.android.package-archive apk;
      }
      default_type application/octet-stream;
      add_header Content-Disposition 'attachment';
      add_header Cache-Control "no-cache";
    }
  }

  # ---- www.pizzadenfert.fr : 301 to the apex ------------------------------
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pizzadenfert.fr;

    ssl_certificate     /etc/nginx/certs/www.pizzadenfert.fr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/www.pizzadenfert.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://pizzadenfert.fr$request_uri;
  }

  # ---- api.pizzadenfert.fr : shared backend for BOTH clients --------------
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pizzadenfert.fr;

    ssl_certificate     /etc/nginx/certs/api.pizzadenfert.fr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.pizzadenfert.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Locally-hosted menu/CMS images (replaces the Supabase Storage
    # "menu-images" public bucket). Filenames are timestamp-stamped and never
    # reused, so long-lived immutable caching is correct.
    location /menu-images/ {
      alias /usr/share/nginx/uploads/menu-images/;
      # This nginx.conf has no top-level `include mime.types`, so nginx's
      # compiled-in default_type (text/plain) would otherwise apply here too
      # (pre-existing site-wide issue, out of scope to fix broadly — see the
      # same problem on e.g. /_expo/static/js/*.js). Scoped fix just for the
      # image/video types this location actually serves. Byte-range requests
      # (needed for video seeking) are handled automatically by nginx's
      # default static-file serving — no extra config needed for that.
      types {
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/gif gif;
        video/mp4 mp4;
        video/webm webm;
      }
      default_type application/octet-stream;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    # CORS is handled inside FastAPI (allow_origins=["*"]). Do NOT add any
    # Access-Control-* headers here — duplication caused a production bug earlier.
    location / {
      proxy_pass http://backend:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
    }
  }

  # ---- loyalty.pizzadenfert.fr : same Expo web bundle as pizzadenfert.fr,
  # serving it under this hostname so the client's isLoyaltyApp() hostname
  # check (src/appMode.ts) can actually detect loyalty mode on web — it used
  # to only proxy to the API here, so the SPA itself was never reachable on
  # this domain and loyalty-only UI (e.g. the account-screen staff/admin
  # entry point) could never render on web. Mirrors the pizzadenfert.fr block
  # below exactly, just under a different server_name + cert pair.
  # --------------------------------------------------------------------------
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name loyalty.pizzadenfert.fr;

    ssl_certificate     /etc/nginx/certs/loyalty.pizzadenfert.fr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/loyalty.pizzadenfert.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/pizzadenfert;
    index index.html;

    location /_expo/  { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|svg|webp|ico)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://backend:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
    }
  }
}
