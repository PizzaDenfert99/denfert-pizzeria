# Pizza Denfert — Nginx reverse-proxy config for the self-hosted VPS.
#
# Serves two public hostnames from the same box:
#   - api.pizzadenfert.fr        → FastAPI backend  (all /api/* traffic)
#   - loyalty.pizzadenfert.fr    → FastAPI backend  (mirror for tablet-qr-scanner
#                                                    and the admin panel)
#
# The customer web app (pizzadenfert.fr) is built statically and served by
# another origin (Emergent, Vercel, or a separate Nginx block — see DEPLOY.md).

worker_processes auto;
events { worker_connections 1024; }

http {
  # ---- Realistic upload cap (menu image base64 payloads) ----
  client_max_body_size 15M;
  server_tokens off;

  # ---- Redirect all plain HTTP to HTTPS ----
  server {
    listen 80;
    listen [::]:80;
    server_name api.pizzadenfert.fr loyalty.pizzadenfert.fr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # ---- api.pizzadenfert.fr : shared backend for BOTH clients ----
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pizzadenfert.fr;

    ssl_certificate     /etc/nginx/certs/api.pizzadenfert.fr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.pizzadenfert.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # CORS is handled inside FastAPI (allow_origins=["*"]) so we do NOT set
    # any Access-Control-* headers here — duplication caused a production
    # bug earlier (browsers reject two conflicting headers).
    location / {
      proxy_pass http://backend:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
    }
  }

  # ---- loyalty.pizzadenfert.fr : same backend, kept as legacy mirror so the
  #      existing tablet-qr-scanner clients keep working while we migrate them ----
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name loyalty.pizzadenfert.fr;

    ssl_certificate     /etc/nginx/certs/loyalty.pizzadenfert.fr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/loyalty.pizzadenfert.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://backend:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
    }
  }
}
