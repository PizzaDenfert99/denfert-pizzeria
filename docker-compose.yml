# Pizza Denfert — production docker-compose for self-hosted VPS.
#
# Brings up 4 services on the host:
#   - mongo        : MongoDB 7 with a named volume for persistence
#   - postgres     : Postgres 16 with a named volume — self-hosted store for
#                    the CMS tables (categories/menu_items/restaurant_settings).
#   - backend      : FastAPI (backend/Dockerfile) on port 8001 inside the network
#   - nginx        : custom nginx image (nginx/Dockerfile) with an entrypoint
#                    that self-generates placeholder certs if missing, so the
#                    container boots on a fresh VPS. ACME HTTP-01 webroot is
#                    mounted from a shared volume for zero-downtime renewals.
#
# See DEPLOY.md for the full deployment guide.

services:
  mongo:
    image: mongo:7
    container_name: pizzadenfert-mongo
    restart: unless-stopped
    # NO host port binding. Other services reach MongoDB via the Docker
    # network as `mongo:27017` (see MONGO_URL below). This avoids collisions
    # with any host-installed mongod (Hetzner cloud images sometimes ship
    # one pre-installed) and prevents accidental public exposure.
    # If you need to inspect the DB with Compass, use `docker compose exec
    # mongo mongosh` or a temporary `-p 27018:27017` override in a
    # docker-compose.override.yml.
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - pizza

  postgres:
    image: postgres:16-alpine
    container_name: pizzadenfert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pizzadenfert}"
      POSTGRES_USER: "${POSTGRES_USER:-pizzadenfert}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — generate with: openssl rand -hex 24}"
    # NO host port binding — same rationale as mongo above. Reached by the
    # backend via the Docker network as `postgres:5432` (see POSTGRES_HOST
    # below).
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pizzadenfert} -d ${POSTGRES_DB:-pizzadenfert}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pizza

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pizzadenfert/backend:latest
    container_name: pizzadenfert-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # ---- Required ----
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "${DB_NAME:-pizzadenfert}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required — generate with 'openssl rand -hex 32'}"
      # ---- Postgres (self-hosted CMS store, replaces Supabase) ----
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-pizzadenfert}"
      POSTGRES_USER: "${POSTGRES_USER:-pizzadenfert}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      UPLOADS_DIR: "/app/uploads/menu-images"
      PUBLIC_IMAGE_BASE: "https://api.pizzadenfert.fr/menu-images"
      # ---- Optional: SMS / OTP ----
      SMS_PROVIDER: "${SMS_PROVIDER:-}"
      OTP_DEMO_MODE: "${OTP_DEMO_MODE:-true}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER:-}"
      OVH_APP_KEY: "${OVH_APP_KEY:-}"
      OVH_APP_SECRET: "${OVH_APP_SECRET:-}"
      OVH_CONSUMER_KEY: "${OVH_CONSUMER_KEY:-}"
      OVH_SMS_SERVICE: "${OVH_SMS_SERVICE:-}"
      OVH_SMS_SENDER: "${OVH_SMS_SENDER:-}"
      # ---- Optional: Web Push / VAPID ----
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_CONTACT: "${VAPID_CONTACT:-mailto:contact@pizzadenfert.fr}"
      # ---- Optional: Emergent native push relay ----
      EMERGENT_PUSH_KEY: "${EMERGENT_PUSH_KEY:-placeholder}"
    # Never publish 8001 on 0.0.0.0 — all traffic reaches the backend through Nginx.
    expose:
      - "8001"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - pizza

  nginx:
    build:
      # Build context is the repo ROOT so the multi-stage Dockerfile can
      # COPY frontend/ (Expo customer app) in the builder stage AND the
      # nginx/docker-entrypoint-init.sh in the runtime stage.
      context: .
      dockerfile: nginx/Dockerfile
    image: pizzadenfert/nginx:latest
    container_name: pizzadenfert-nginx
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Consumed by nginx/docker-entrypoint-init.sh for placeholder-cert gen.
      # Order matches the server_name blocks in nginx.conf.
      NGINX_CERT_HOSTS: "pizzadenfert.fr www.pizzadenfert.fr api.pizzadenfert.fr loyalty.pizzadenfert.fr"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
      # Shared with certbot for HTTP-01 ACME challenges (zero-downtime renewals).
      - certbot_webroot:/var/www/certbot
      # Locally-hosted menu/CMS images (replaces Supabase Storage). Mounted at
      # the same relative point as the backend's /app/uploads so the actual
      # `menu-images/...` subdirectory lines up identically in both
      # containers. Read-only — only the backend writes here.
      - uploads_data:/usr/share/nginx/uploads:ro
      # Ad-hoc distributable files (e.g. APK builds) dropped for direct
      # download at /downloads/ — see nginx/nginx.conf. Plain host bind mount
      # (not a named volume) so files can be dropped in directly via `cp`/
      # `curl -o` without going through the container.
      - ./nginx/downloads:/usr/share/nginx/downloads:ro
    networks:
      - pizza

  # -------------------------------------------------------------------------
  # certbot — opt-in one-shot service for issuing/renewing Let's Encrypt certs
  # via the HTTP-01 webroot method. NOT started by `docker compose up`.
  # Use it via `make cert-issue` (see Makefile).
  # -------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: pizzadenfert-certbot
    profiles: ["cert"]
    volumes:
      - ./nginx/certs:/etc/letsencrypt/live-out
      - certbot_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    # The command is provided by scripts/cert-issue.sh at invocation time.
    command: ["echo 'Invoke via scripts/cert-issue.sh or `make cert-issue`.'"]

volumes:
  mongo_data:
    driver: local
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  certbot_data:
    driver: local
  certbot_webroot:
    driver: local

networks:
  pizza:
    driver: bridge
